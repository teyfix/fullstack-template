x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 15
  start_period: 3s
  start_interval: 1s

volumes:
  postgres_data:

networks:
  net-postgres:
  net-pgbouncer:

services:
  postgres:
    image: ${POSTGRES_IMAGE:?}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
    expose: [5432]
    networks:
      traefik:
      net-postgres: { aliases: [postgres.lokal] }
    volumes:
      - postgres_data:/var/lib/postgresql/data
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.tcp.services.${APP_NAME:?}_postgres.loadbalancer.server.port=5432"
      - "traefik.tcp.routers.${APP_NAME:?}_postgres.rule=HostSNI(`postgres.${APP_DOMAIN:?}`)"
      - "traefik.tcp.routers.${APP_NAME:?}_postgres.entrypoints=shared"
      - "traefik.tcp.routers.${APP_NAME:?}_postgres.tls=true"
      - "traefik.tcp.routers.${APP_NAME:?}_postgres.tls.certresolver=stepca"
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }
    healthcheck:
      <<: *healthcheck
      test: [CMD, psql, -h, localhost, -U, "${POSTGRES_USER:?}", -d, "${POSTGRES_DB:?}", -c, "SELECT 1;"]

  pgbouncer:
    build:
      dockerfile_inline: |
        FROM ${PGBOUNCER_IMAGE:?}
        COPY --from=${GOMPLATE_IMAGE:?} /bin/gomplate /usr/local/bin/gomplate
    entrypoint: /bin/sh
    command: /app/entrypoint.sh
    restart: unless-stopped
    environment:
      AUTH_FILE: /tmp/app/userlist.txt
      DB_HOST: postgres.lokal
      DB_NAME: ${POSTGRES_DB:?}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      DB_USER: ${POSTGRES_USER:?}
      PGBOUNCER_PASS: ${PGBOUNCER_PASS:?}
      PGBOUNCER_USER: ${PGBOUNCER_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
    volumes:
      - ${PWD}/compose/postgres/pgbouncer/app:/app:ro
      - ${PWD}/compose/postgres/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    tmpfs: [/tmp]
    expose: [5432]
    networks:
      net-pgbouncer: { aliases: [pgbouncer.lokal] }
      net-postgres:
      traefik:
    depends_on:
      postgres: { condition: service_healthy }
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.tcp.services.${APP_NAME:?}_pgbouncer.loadbalancer.server.port=5432"
      - "traefik.tcp.routers.${APP_NAME:?}_pgbouncer.rule=HostSNI(`pgbouncer.${APP_DOMAIN:?}`)"
      - "traefik.tcp.routers.${APP_NAME:?}_pgbouncer.entrypoints=shared"
      - "traefik.tcp.routers.${APP_NAME:?}_pgbouncer.tls=true"
      - "traefik.tcp.routers.${APP_NAME:?}_pgbouncer.tls.certresolver=stepca"
      - "traefik.tcp.routers.${APP_NAME:?}_pgbouncer.service=${APP_NAME:?}_pgbouncer"
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }
    healthcheck:
      <<: *healthcheck
      test: [CMD, psql, -h, localhost, -U, "${POSTGRES_USER:?}", -d, "${POSTGRES_DB:?}", -c, "SELECT 1;"]
